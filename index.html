<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ഫീസ് മാനേജ്മെന്റ് സിസ്റ്റം - ലോഗിൻ</title>
    <!-- Tailwind CSS CDN for Premium Look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 p-8 text-white">
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="inline-flex bg-indigo-600/30 p-3 rounded-full mb-3 border border-indigo-400/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">ഫീസ് പോർട്ടൽ</h1>
            <p class="text-slate-300 text-sm mt-1">മദ്രസ / സ്ഥാപന ലോഗിൻ</p>
        </div>

        <!-- Error / Success Message Box -->
        <div id="messageBox" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-200 mb-2">ഇമെയിൽ വിലാസം</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-500 transition"
                    placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-200 mb-2">പാസ്‌വേഡ്</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-500 transition"
                    placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-slate-300 cursor-pointer">
                    <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                    <span class="ml-2">എന്നെ ഓർമ്മിക്കുക</span>
                </label>
                <a href="#" class="text-indigo-400 hover:text-indigo-300 transition">പാസ്‌വേഡ് മറന്നോ?</a>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
                ലോഗിൻ ചെയ്യുക
            </button>
        </form>

        <!-- Footer Note -->
        <div class="mt-8 text-center text-xs text-slate-400">
            <p>സുരക്ഷിതമായ ഫീസ് മാനേജ്മെന്റ് സിസ്റ്റം</p>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA-DEAr98P18Pe3vfFdHC6bmIZyr47kLeg",
            authDomain: "fees-management-app-62588.firebaseapp.com",
            projectId: "fees-management-app-62588",
            storageBucket: "fees-management-app-62588.firebasestorage.app",
            messagingSenderId: "347392125928",
            appId: "1:347392125928:web:f4c9f6e23cee32f0a1525d",
            measurementId: "G-1VQGK123KY"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Make handleLogin function available globally
        window.handlelogin = function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('messageBox');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "ലോഗിൻ ചെയ്യുന്നു...";

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed in 
                    msgBox.className = "mb-4 p-3 rounded-xl text-sm text-center bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                    msgBox.innerText = "ലോഗിൻ വിജയകരം! ഡാഷ്‌ബോർഡിലേക്ക് പോകുന്നു...";
                    msgBox.classList.remove('hidden');

                    // Redirect to dashboard (create dashboard.html later)
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                })
                .catch((error) => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "ലോഗിൻ ചെയ്യുക";
                    
                    msgBox.className = "mb-4 p-3 rounded-xl text-sm text-center bg-rose-500/20 text-rose-300 border border-rose-500/30";
                    msgBox.innerText = "ലോഗിൻ പരാജയപ്പെട്ടു: ഇമെയിലും പാസ്‌വേഡും പരിശോധിക്കുക.";
                    msgBox.classList.remove('hidden');
                });
        }
    </script>
    <script>
        // Form submit wrapper
        function handleLogin(event) {
            if(window.handlelogin) {
                window.handlelogin(event);
            }
        }
    </script>
</body>
</html>
