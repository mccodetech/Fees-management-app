<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സ്ഥാപന ലോഗിൻ - ഫീസ് പോർട്ടൽ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold">ഫീസ് പോർട്ടൽ</h1>
            <p class="text-xs text-slate-400 mt-1">സ്ഥാപന ലോഗിൻ</p>
        </div>

        <form onsubmit="handleDirectLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">ഇമെയിൽ വിലാസം</label>
                <input type="email" id="email" required class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">പാസ്‌വേഡ്</label>
                <input type="password" id="password" required class="w-full px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-indigo-600/30">
                ലോഗിൻ ചെയ്യുക
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-DEAr98P18Pe3vfFdHC6bmIZyr47kLeg",
            authDomain: "fees-management-app-62588.firebaseapp.com",
            projectId: "fees-management-app-62588",
            storageBucket: "fees-management-app-62588.firebasestorage.app",
            messagingSenderId: "347392125928",
            appId: "1:347392125928:web:f4c9f6e23cee32f0a1525d",
            measurementId: "G-1VQGK123KY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleDirectLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                // ഡാറ്റാബേസിലെ institutions കളക്ഷനിൽ ഇമെയിലും പാസ്‌വേഡും പരിശോധിക്കുന്നു
                const q = query(
                    collection(db, "institutions"), 
                    where("email", "==", email),
                    where("password", "==", password)
                );
                
                const querySnapshot = await getDocs(q);
                let found = false;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.status === "Active") {
                        found = true;
                        // ലോഗിൻ വിവരങ്ങൾ ലോക്കൽ സ്റ്റോറേജിൽ സേവ് ചെയ്യുന്നു
                        localStorage.setItem('loggedInEmail', email);
                        localStorage.setItem('instCode', data.instCode);
                        
                        alert("ലോഗിൻ വിജയം!");
                        window.location.href = 'institution-dashboard.html';
                    } else {
                        alert("നിങ്ങളുടെ അക്കൗണ്ട് സൂപ്പർ അഡ്മിൻ ഇതുവരെ സജീവമാക്കിയിട്ടില്ല.");
                        found = true;
                    }
                });

                if (!found) {
                    alert("തെറ്റായ ഇമെയിൽ അല്ലെങ്കിൽ പാസ്‌വേഡ്.");
                }
            } catch (error) {
                console.error("Login error: ", error);
                alert("ലോഗിൻ ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു.");
            }
        }
    </script>
</body>
</html>
