<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സ്ഥാപന രജിസ്ട്രേഷൻ - ഫീസ് പോർട്ടൽ</title>
    <!-- Tailwind CSS CDN for Premium Look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white/15 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 p-8 text-white my-8">
        <!-- Header Section -->
        <div class="text-center mb-6">
            <div class="inline-flex bg-indigo-600/30 p-3 rounded-full mb-2 border border-indigo-400/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">സ്ഥാപന രജിസ്ട്രേഷൻ</h1>
            <p class="text-slate-300 text-sm mt-1">ഫീസ് മാനേജ്മെന്റ് സിസ്റ്റത്തിലേക്ക് സ്വാഗതം</p>
        </div>

        <!-- Success / Error Message Box -->
        <div id="messageBox" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

        <!-- Registration Form -->
        <form id="registerForm" onsubmit="handleRegistration(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-200 mb-1">സ്ഥാപനത്തിന്റെ പേര്</label>
                <input type="text" id="instName" required 
                    class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition"
                    placeholder="ഉദാ: മദ്രസത്തുൽ ഇസ്‌ലാം">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-1">സ്ഥാപനത്തിന്റെ തരം</label>
                    <select id="instType" required
                        class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white transition">
                        <option value="" disabled selected>തിരഞ്ഞെടുക്കുക</option>
                        <option value="Madrasa">മദ്രസ</option>
                        <option value="School">സ്കൂൾ</option>
                        <option value="Mahallu">മഹല്ല്</option>
                        <option value="Committee">മറ്റ് കമ്മറ്റികൾ</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-1">സ്ഥലം (Location)</label>
                    <input type="text" id="instLocation" required 
                        class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition"
                        placeholder="സ്ഥലം / ജില്ല">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-1">മൊബൈൽ നമ്പർ</label>
                    <input type="tel" id="instPhone" required 
                        class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition"
                        placeholder="9876543210">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-1">ആവശ്യമായ വേർഷൻ</label>
                    <select id="versionType" required
                        class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white transition">
                        <option value="Trial">ട്രയൽ വേർഷൻ (1 മാസം സൗജന്യം)</option>
                        <option value="Permanent">പെർമനെന്റ് വേർഷൻ (1 വർഷം)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-200 mb-1">ഇമെയിൽ വിലാസം (ലോഗിൻ ചെയ്യാൻ)</label>
                <input type="email" id="instEmail" required 
                    class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition"
                    placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-200 mb-1">പാസ്‌വേഡ്</label>
                <input type="password" id="instPassword" required 
                    class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 mt-2">
                രജിസ്റ്റർ ചെയ്യുക
            </button>
        </form>

        <!-- Footer Note -->
        <div class="mt-6 text-center text-xs text-slate-400">
            <p>രജിസ്ട്രേഷന് ശേഷം സൂപ്പർ അഡ്മിന്റെ അനുമതി ലഭിച്ചാലുടൻ ലോഗിൻ ചെയ്യാവുന്നതാണ്.</p>
        </div>
    </div>

    <!-- Script Section -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyA-DEAr98P18Pe3vfFdHC6bmIZyr47kLeg",
        authDomain: "fees-management-app-62588.firebaseapp.com",
        projectId: "fees-management-app-62588",
        storageBucket: "fees-management-app-62588.firebasestorage.app",
        messagingSenderId: "347392125928",
        appId: "1:347392125928:web:f4c9f6e23cee32f0a1525d",
        measurementId: "G-1VQGK123KY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.handleRegistration = async function(event) {
        event.preventDefault();
        
        const name = document.getElementById('instName').value;
        const type = document.getElementById('instType').value;
        const location = document.getElementById('instLocation').value;
        const phone = document.getElementById('instPhone').value;
        const version = document.getElementById('versionType').value;
        const email = document.getElementById('instEmail').value;
        const password = document.getElementById('instPassword').value;
        const msgBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.disabled = true;
        submitBtn.innerText = "Register cheyyunnu...";

        try {
            // Firestore-ile 'institutions' collection-lekku data save cheyyunnu
            await addDoc(collection(db, "institutions"), {
                name: name,
                type: type,
                location: location,
                phone: phone,
                version: version,
                email: email,
                password: password,
                status: "Pending",
                createdAt: new Date()
            });

            msgBox.className = "mb-4 p-3 rounded-xl text-sm text-center bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
            msgBox.innerText = "Registration vijayakaramayi poorthiyayi! Super admin-ante anumatikayi kathirikkuka.";
            msgBox.classList.remove('hidden');

            document.getElementById('registerForm').reset();
        } catch (error) {
            console.error("Error adding document: ", error);
            msgBox.className = "mb-4 p-3 rounded-xl text-sm text-center bg-rose-500/20 text-rose-300 border border-rose-500/30";
            msgBox.innerText = "Error: Data save cheyyan kazhunjilla.";
            msgBox.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Register cheyyuka";
        }
    }
</script>
</body>
</html>
