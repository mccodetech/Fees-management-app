<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സൂപ്പർ അഡ്മിൻ ഡാഷ്‌ബോർഡ് - ഫീസ് പോർട്ടൽ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600/30 p-2 rounded-lg border border-indigo-400/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-wide">സൂപ്പർ അഡ്മിൻ പാനൽ</h1>
            </div>
            <button onclick="logoutAdmin()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-4 py-2 rounded-xl text-sm font-medium transition">
                ലോഗ് ഔട്ട്
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <p class="text-slate-400 text-sm">ആകെ സ്ഥാപനങ്ങൾ</p>
                <h3 class="text-3xl font-bold mt-2 text-indigo-400" id="totalInst">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <p class="text-slate-400 text-sm">അനുമതി കാത്തിരിക്കുന്നവ (Pending)</p>
                <h3 class="text-3xl font-bold mt-2 text-amber-400" id="pendingInst">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <p class="text-slate-400 text-sm">സജീവമായവ (Active)</p>
                <h3 class="text-3xl font-bold mt-2 text-emerald-400" id="activeInst">0</h3>
            </div>
        </div>

        <!-- Institutions Approval Table Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold">സ്ഥാപനങ്ങളുടെ രജിസ്ട്രേഷനും കോഡ് അസൈൻ ചെയ്യലും</h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-950/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="p-4">സ്ഥാപനം & തരം</th>
                            <th class="p-4">കോൺടാക്റ്റ് വിവരങ്ങൾ</th>
                            <th class="p-4">വേർഷൻ & കോഡ് (Prefix)</th>
                            <th class="p-4">സ്റ്റാറ്റസ്</th>
                            <th class="p-4 text-right">നടപടികൾ (ACTIONS)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800 text-sm" id="institutionTableBody">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-400">ഡാറ്റ ലോഡ് ചെയ്യുന്നു...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-DEAr98P18Pe3vfFdHC6bmIZyr47kLeg",
            authDomain: "fees-management-app-62588.firebaseapp.com",
            projectId: "fees-management-app-62588",
            storageBucket: "fees-management-app-62588.firebasestorage.app",
            messagingSenderId: "347392125928",
            appId: "1:347392125928:web:f4c9f6e23cee32f0a1525d",
            measurementId: "G-1VQGK123KY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadInstitutions() {
            const tableBody = document.getElementById('institutionTableBody');
            
            try {
                const querySnapshot = await getDocs(collection(db, "institutions"));
                let rows = "";
                let total = 0;
                let pending = 0;
                let active = 0;

                querySnapshot.forEach((document) => {
                    const data = document.data();
                    const docId = document.id;
                    total++;

                    if (data.status === "Active") {
                        active++;
                    } else {
                        pending++;
                    }

                    const statusBadge = data.status === "Active" 
                        ? `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-full text-xs">സജീവം (Active)</span>`
                        : `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-1 rounded-full text-xs">പെൻഡിംഗ്</span>`;

                    const codeDisplay = data.instCode ? `<div class="text-xs text-indigo-400 font-bold mt-1">കോഡ്: ${data.instCode}</div>` : `<div class="text-xs text-rose-400 mt-1">കോഡ് നൽകിയിട്ടില്ല</div>`;

                    const actionBtn = data.status === "Active"
                        ? `<a href="https://wa.me/91${data.phone}?text=നിങ്ങളുടെ%20ഫീസ്%20പോർട്ടൽ%20അക്കൗണ്ട്%20സജീവമാണ്.%20കോഡ്:%20${data.instCode}" target="_blank" class="inline-flex items-center text-xs bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 px-3 py-1.5 rounded-lg hover:bg-emerald-600/30 transition">വാട്‌സ്ആപ്പ് അയക്കുക</a>`
                        : `<button onclick="approveInst('${docId}', '${data.name}', '${data.phone}', '${data.version}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">അപ്പ്രൂവ് & കോഡ് നൽകുക</button>
                           <button onclick="rejectInst('${docId}')" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 px-3 py-1.5 rounded-lg text-xs font-medium transition ml-1">നിരസിക്കുക</button>`;

                    rows += `
                        <tr>
                            <td class="p-4">
                                <div class="font-semibold text-white">${data.name}</div>
                                <div class="text-xs text-slate-400">${data.type}</div>
                            </td>
                            <td class="p-4">
                                <div class="text-indigo-300 text-xs">${data.email}</div>
                                <div class="text-xs text-slate-400 mt-0.5">${data.phone} (${data.location})</div>
                            </td>
                            <td class="p-4">
                                <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full text-xs">${data.version}</span>
                                ${codeDisplay}
                            </td>
                            <td class="p-4">${statusBadge}</td>
                            <td class="p-4 text-right">${actionBtn}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = rows || `<tr><td colspan="5" class="p-4 text-center text-slate-400">രജിസ്ട്രേഷനുകൾ ഒന്നും ലഭ്യമല്ല.</td></tr>`;
                document.getElementById('totalInst').innerText = total;
                document.getElementById('pendingInst').innerText = pending;
                document.getElementById('activeInst').innerText = active;

            } catch (error) {
                console.error("Error loading institutions: ", error);
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-400">ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു.</td></tr>`;
            }
        }

        window.approveInst = async function(docId, instName, phone, version) {
            const instCode = prompt("ഈ സ്ഥാപനത്തിന് നൽകേണ്ട യൂണിക്ക് കോഡ് (Prefix) നൽകുക (ഉദാ: MAD01, SCH02):");
            if (!instCode) return;

            try {
                const docRef = doc(db, "institutions", docId);
                await updateDoc(docRef, { 
                    status: "Active",
                    instCode: instCode.trim().toUpperCase()
                });

                alert("സ്ഥാപനത്തിന് അപ്പ്രൂവലും കോഡും വിജയകരമായി നൽകി!");
                loadInstitutions();

                const msg = encodeURIComponent(`അസ്സലാമു അലൈക്കും / നമസ്കാരം, ${instName}! ഫീസ് മാനേജ്മെന്റ് പോർട്ടലിലേക്കുള്ള നിങ്ങളുടെ അക്കൗണ്ട് അപ്പ്രൂവ് ചെയ്തിരിക്കുന്നു. നിങ്ങളുടെ സ്ഥാപന കോഡ്: ${instCode.toUpperCase()}.`);
                window.open(`https://wa.me/91${phone}?text=${msg}`, '_blank');
            } catch (error) {
                console.error("Error approving: ", error);
            }
        }

        window.rejectInst = async function(docId) {
            if(confirm("ഈ രജിസ്ട്രേഷൻ നിരസിക്കണമെന്നുറപ്പാണോ?")) {
                try {
                    await deleteDoc(doc(db, "institutions", docId));
                    alert("രജിസ്ട്രേഷൻ നിരസിച്ചു.");
                    loadInstitutions();
                } catch (error) {
                    console.error("Error deleting: ", error);
                }
            }
        }

        window.logoutAdmin = function() {
            window.location.href = 'admin-login.html';
        }

        loadInstitutions();
    </script>
</body>
</html>
