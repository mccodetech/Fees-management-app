<!DOCTYPE html>
<html lang="ml" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">സ്ഥാപന രജിസ്ട്രേഷൻ - ഫീസ് പോർട്ടൽ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href="index.html" class="flex items-center space-x-2">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold shadow-md shadow-indigo-600/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                    </div>
                    <span class="text-sm sm:text-base font-bold tracking-wide text-white" data-ml="ഫീസ് പോർട്ടൽ" data-en="Fee Portal">ഫീസ് പോർട്ടൽ</span>
                </a>
            </div>
            <div>
                <a href="index.html" class="text-[11px] sm:text-xs font-medium text-slate-300 hover:text-white bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-lg transition" data-ml="ലോഗിൻ ചെയ്യുക" data-en="Login">
                    ലോഗിൻ ചെയ്യുക
                </a>
            </div>
        </div>
    </header>

    <!-- Main Registration Section -->
    <main class="max-w-2xl w-full mx-auto px-4 py-8 sm:py-12 my-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-lg sm:text-xl font-bold tracking-wide text-white" data-ml="സ്ഥാപന രജിസ്ട്രേഷൻ" data-en="Institution Registration">സ്ഥാപന രജിസ്ട്രേഷൻ</h1>
                <p class="text-slate-400 text-xs mt-1" data-ml="നിങ്ങളുടെ സ്ഥാപനത്തിന്റെ വിവരങ്ങൾ നൽകി രജിസ്റ്റർ ചെയ്യുക" data-en="Register by providing your institution details">നിങ്ങളുടെ സ്ഥാപനത്തിന്റെ വിവരങ്ങൾ നൽകി രജിസ്റ്റർ ചെയ്യുക</p>
            </div>

            <form onsubmit="handleRegistration(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="സ്ഥാപനത്തിന്റെ തരം" data-en="Institution Type">സ്ഥാപനത്തിന്റെ തരം</label>
                    <select id="instType" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                        <option value="" disabled selected data-ml="സ്ഥാപനത്തിന്റെ തരം തിരഞ്ഞെടുക്കുക" data-en="Select Institution Type">സ്ഥാപനത്തിന്റെ തരം തിരഞ്ഞെടുക്കുക</option>
                        <option value="മദ്രസ" data-ml="മദ്രസ" data-en="Madrasa">മദ്രസ</option>
                        <option value="സ്കൂൾ" data-ml="സ്കൂൾ" data-en="School">സ്കൂൾ</option>
                        <option value="കോളേജ്" data-ml="കോളേജ്" data-en="College">കോളേജ്</option>
                        <option value="മഹല്ല്" data-ml="മഹല്ല്" data-en="Mahall">മഹല്ല്</option>
                        <option value="മറ്റ് കമ്മറ്റികൾ" data-ml="മറ്റ് കമ്മറ്റികൾ" data-en="Other Committees">മറ്റ് കമ്മറ്റികൾ</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="സ്ഥാപനത്തിന്റെ പേര്" data-en="Institution Name">സ്ഥാപനത്തിന്റെ പേര്</label>
                        <input type="text" id="instName" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" data-placeholder-ml="സ്ഥാപനത്തിന്റെ പേര്" data-placeholder-en="Institution Name" placeholder="സ്ഥാപനത്തിന്റെ പേര്">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="സ്ഥലം / വിലാസം" data-en="Location / Address">സ്ഥലം / വിലാസം</label>
                        <input type="text" id="instLocation" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" data-placeholder-ml="സ്ഥലം" data-placeholder-en="Location" placeholder="സ്ഥലം">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="പഞ്ചായത്ത് / മുൻസിപ്പാലിറ്റി" data-en="Panchayath / Municipality">പഞ്ചായത്ത് / മുൻസിപ്പാലിറ്റി</label>
                        <input type="text" id="instPanchayath" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" data-placeholder-ml="പഞ്ചായത്ത്" data-placeholder-en="Panchayath" placeholder="പഞ്ചായത്ത്">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="ജില്ല" data-en="District">ജില്ല</label>
                        <input type="text" id="instDistrict" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" data-placeholder-ml="ജില്ല" data-placeholder-en="District" placeholder="ജില്ല">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="ചുമതലപ്പെട്ട ആളുടെ പേര് & തസ്തിക" data-en="In-charge Person Name & Designation">ചുമതലപ്പെട്ട ആളുടെ പേര് & തസ്തിക</label>
                        <input type="text" id="inchargeName" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" data-placeholder-ml="ഉദാ: സെക്രട്ടറി / പ്രസിഡന്റ്" data-en="e.g: Secretary / President" placeholder="ഉദാ: സെക്രട്ടറി / പ്രസിഡന്റ്">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="വ്യക്തിഗത മൊബൈൽ നമ്പർ" data-en="Personal Mobile Number">വ്യക്തിഗത മൊബൈൽ നമ്പർ</label>
                        <input type="tel" id="inchargePhone" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="9876543210">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="സ്ഥാപനത്തിന്റെ ഇമെയിൽ ഐഡി" data-en="Institution Email ID">സ്ഥാപനത്തിന്റെ ഇമെയിൽ ഐഡി</label>
                        <input type="email" id="instEmail" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="admin@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="വാട്‌സ്ആപ്പ് നമ്പർ" data-en="WhatsApp Number">വാട്‌സ്ആപ്പ് നമ്പർ</label>
                        <input type="tel" id="instWhatsapp" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="9876543210">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1" data-ml="പാസ്‌വേഡ് (ലോഗിൻ ചെയ്യാൻ)" data-en="Password (for login)">പാസ്‌വേഡ് (ലോഗിൻ ചെയ്യാൻ)</label>
                    <input type="password" id="instPassword" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="••••••••">
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition shadow-md shadow-indigo-600/30 mt-2" data-ml="രജിസ്റ്റർ ചെയ്യുക" data-en="Register">
                    രജിസ്റ്റർ ചെയ്യുക
                </button>
            </form>
        </div>
    </main>

    <!-- Custom Modal -->
    <div id="customModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl text-center">
            <h3 id="modalTitle" class="text-base font-bold text-white">വിജയം!</h3>
            <p id="modalMessage" class="text-xs text-slate-300 mt-1 mb-5">രജിസ്ട്രേഷൻ വിജയകരമായി പൂർത്തിയായി.</p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition" data-ml="ശരി" data-en="OK">ശരി</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-[11px] text-slate-500">
        <p data-ml="© 2026 ഫീസ് മാനേജ്‌മെന്റ് പോർട്ടൽ. സർവ്വ അവകാശങ്ങളും സുരക്ഷിതം." data-en="© 2026 Fee Management Portal. All rights reserved.">© 2026 ഫീസ് മാനേജ്‌മെന്റ് പോർട്ടൽ. സർവ്വ അവകാശങ്ങളും സുരക്ഷിതം.</p>
    </footer>

    <!-- Scripting -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-DEAr98P18Pe3vfFdHC6bmIZyr47kLeg",
            authDomain: "fees-management-app-62588.firebaseapp.com",
            projectId: "fees-management-app-62588",
            storageBucket: "fees-management-app-62588.firebasestorage.app",
            messagingSenderId: "347392125928",
            appId: "1:347392125928:web:f4c9f6e23cee32f0a1525d",
            measurementId: "G-1VQGK123KY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let shouldRedirect = false;

        function applyLanguage(lang) {
            document.querySelectorAll('[data-ml]').forEach(el => {
                if(el.getAttribute(`data-${lang}`)) {
                    el.innerText = el.getAttribute(`data-${lang}`);
                }
            });

            document.querySelectorAll('[data-placeholder-ml]').forEach(el => {
                if(el.getAttribute(`data-placeholder-${lang}`)) {
                    el.placeholder = el.getAttribute(`data-placeholder-${lang}`);
                }
            });
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('preferredLang') || 'ml';
            applyLanguage(savedLang);
        }

        window.handleRegistration = async function(event) {
            event.preventDefault();
            const lang = localStorage.getItem('preferredLang') || 'ml';
            
            const type = document.getElementById('instType').value;
            const name = document.getElementById('instName').value.trim();
            const location = document.getElementById('instLocation').value.trim();
            const panchayath = document.getElementById('instPanchayath').value.trim();
            const district = document.getElementById('instDistrict').value.trim();
            const inchargeName = document.getElementById('inchargeName').value.trim();
            const inchargePhone = document.getElementById('inchargePhone').value.trim();
            const email = document.getElementById('instEmail').value.trim();
            const whatsapp = document.getElementById('instWhatsapp').value.trim();
            const password = document.getElementById('instPassword').value.trim();

            try {
                await addDoc(collection(db, "institutions"), {
                    type, name, location, panchayath, district, inchargeName, inchargePhone, email, whatsapp, password,
                    instCode: "", // സൂപ്പർ അഡ്മിൻ അപ്രൂവ് ചെയ്യുമ്പോൾ നൽകും
                    status: "Pending",
                    createdAt: new Date()
                });

                document.getElementById('modalTitle').innerText = lang === 'en' ? "Success!" : "വിജയം!";
                document.getElementById('modalMessage').innerText = lang === 'en' ? "Registration successful! Waiting for super admin approval." : "രജിസ്ട്രേഷൻ വിജയകരമായി പൂർത്തിയായി! സൂപ്പർ അഡ്മിന്റെ അനുമതിക്കായി കാത്തിരിക്കുന്നു.";
                document.getElementById('customModal').classList.remove('hidden');
                shouldRedirect = true;
            } catch (error) {
                console.error("Registration error: ", error);
                document.getElementById('modalTitle').innerText = lang === 'en' ? "Error" : "പിശക്";
                document.getElementById('modalMessage').innerText = lang === 'en' ? "Registration failed." : "രജിസ്ട്രേഷൻ പരാജയപ്പെട്ടു.";
                document.getElementById('customModal').classList.remove('hidden');
            }
        }

        window.closeModal = function() {
            document.getElementById('customModal').classList.add('hidden');
            if (shouldRedirect) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
