<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സ്ഥാപന രജിസ്ട്രേഷൻ - ഫീസ് പോർട്ടൽ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <a href="index.html" class="flex items-center space-x-2.5">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold shadow-md shadow-indigo-600/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                    </div>
                    <span class="text-base font-bold tracking-wide text-white">ഫീസ് പോർട്ടൽ</span>
                </a>
            </div>
            <div>
                <a href="index.html" class="text-xs font-medium text-slate-300 hover:text-white bg-slate-800 border border-slate-700 px-3.5 py-1.5 rounded-lg transition">ലോഗിൻ ചെയ്യുക</a>
            </div>
        </div>
    </header>

    <!-- Registration Form Section -->
    <main class="max-w-xl mx-auto px-4 py-10 my-auto w-full">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-xl font-bold text-white">സ്ഥാപന രജിസ്ട്രേഷൻ</h1>
                <p class="text-xs text-slate-400 mt-1">നിങ്ങളുടെ സ്ഥാപനത്തിന്റെ വിവരങ്ങൾ നൽകി രജിസ്റ്റർ ചെയ്യുക</p>
            </div>

            <form onsubmit="handleRegistration(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">സ്ഥാപനത്തിന്റെ തരം</label>
                    <select id="instType" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="" disabled selected>സ്ഥാപനത്തിന്റെ തരം തിരഞ്ഞെടുക്കുക</option>
                        <option value="മദ്രസ">മദ്രസ</option>
                        <option value="സ്കൂൾ">സ്കൂൾ</option>
                        <option value="മഹല്ല്">മഹല്ല്</option>
                        <option value="മറ്റ് കമ്മറ്റികൾ">മറ്റ് കമ്മറ്റികൾ</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">സ്ഥാപനത്തിന്റെ പേര്</label>
                        <input type="text" id="instName" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 outline-none uppercase" placeholder="സ്ഥാപനത്തിന്റെ പേര്">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">സ്ഥലം / വിലാസം</label>
                        <input type="text" id="instLocation" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 outline-none uppercase" placeholder="സ്ഥലം">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">കോൺടാക്റ്റ് നമ്പർ</label>
                        <input type="tel" id="instPhone" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="9876543210">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">പ്രീഫിക്സ് കോഡ് (ഉദാ: MD01)</label>
                        <input type="text" id="instCode" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 outline-none uppercase" placeholder="MD01 / MH01">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">ഇമെയിൽ വിലാസം (ലോഗിൻ ചെയ്യാൻ)</label>
                    <input type="email" id="instEmail" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin@example.com">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">പാസ്‌വേഡ്</label>
                    <input type="password" id="instPassword" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition shadow-md shadow-indigo-600/30 mt-2">
                    രജിസ്റ്റർ ചെയ്യുക
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-[11px] text-slate-500">
        <p>© 2026 ഫീസ് മാനേജ്‌മെന്റ് പോർട്ടൽ. സർവ്വ അവകാശങ്ങളും സുരക്ഷിതം.</p>
    </footer>

    <!-- Scripting -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-DEAr98P18Pe3vfFdHC6bmIZyr47kLeg",
            authDomain: "fees-management-app-62588.firebaseapp.com",
            projectId: "fees-management-app-62588",
            storageBucket: "fees-management-app-62588.firebasestorage.app",
            messagingSenderId: "347392125928",
            appId: "1:347392125928:web:f4c9f6e23cee32f0a1525d",
            measurementId: "G-1VQGK123KY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleRegistration = async function(event) {
            event.preventDefault();
            const type = document.getElementById('instType').value;
            const name = document.getElementById('instName').value.trim().toUpperCase();
            const location = document.getElementById('instLocation').value.trim().toUpperCase();
            const phone = document.getElementById('instPhone').value.trim();
            const instCode = document.getElementById('instCode').value.trim().toUpperCase();
            const email = document.getElementById('instEmail').value.trim();
            const password = document.getElementById('instPassword').value.trim();

            try {
                await addDoc(collection(db, "institutions"), {
                    type: type,
                    name: name,
                    location: location,
                    phone: phone,
                    instCode: instCode,
                    email: email,
                    password: password,
                    status: "Active", // പെട്ടെന്ന് ലോഗിൻ ചെയ്യാൻ Active എന്ന് സെറ്റ് ചെയ്യുന്നു
                    createdAt: new Date()
                });

                alert("സ്ഥാപന രജിസ്ട്രേഷൻ വിജയകരം! ഇപ്പോൾ നിങ്ങൾക്ക് ലോഗിൻ ചെയ്യാം.");
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Error registering institution: ", error);
                alert("രജിസ്ട്രേഷൻ പരാജയപ്പെട്ടു.");
            }
        }
    </script>
</body>
</html>
