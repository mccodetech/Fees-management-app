<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>അംഗങ്ങളുടെ പോർട്ടൽ - ഫീസ് സിസ്റ്റം</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 p-8 text-white">
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="inline-flex bg-indigo-600/30 p-3 rounded-full mb-3 border border-indigo-400/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">അംഗങ്ങളുടെ പോർട്ടൽ</h1>
            <p class="text-slate-300 text-sm mt-1">ഫീസ് വിവരങ്ങൾ പരിശോധിക്കാൻ ലോഗിൻ ചെയ്യുക</p>
        </div>

        <!-- Error Message Box -->
        <div id="messageBox" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

        <!-- Login Form -->
        <form id="memberLoginForm" onsubmit="handleMemberLogin(event)" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-200 mb-2">അംഗത്തിന്റെ ഐഡി / കോഡ് (ഉദാ: MD01-001)</label>
                <input type="text" id="memberId" required 
                    class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-500 transition"
                    placeholder="INSTCODE-001">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-200 mb-2">മൊബൈൽ നമ്പർ</label>
                <input type="tel" id="memberPhone" required 
                    class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-500 transition"
                    placeholder="9876543210">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
                വിവരങ്ങൾ പരിശോധിക്കുക
            </button>
        </form>

        <!-- Footer Note -->
        <div class="mt-8 text-center text-xs text-slate-400">
            <p>സ്ഥാപനം നൽകിയ ഐഡിയും ഫോൺ നമ്പറും ഉപയോഗിക്കുക</p>
        </div>
    </div>

    <!-- Script Section -->
    <script>
        function handleMemberLogin(event) {
            event.preventDefault();
            const memberId = document.getElementById('memberId').value.trim();
            const phone = document.getElementById('memberPhone').value.trim();
            const msgBox = document.getElementById('messageBox');

            // ഡെമോ പരിശോധന (ഡാറ്റാബേസ് കണക്ട് ചെയ്യുമ്പോൾ ഇത് ഫയർബേസിൽ നിന്ന് പരിശോധിക്കാം)
            if (memberId && phone.length >= 10) {
                msgBox.className = "mb-4 p-3 rounded-xl text-sm text-center bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                msgBox.innerText = "ലോഗിൻ വിജയകരം! വിവരങ്ങൾ എടുക്കുന്നു...";
                msgBox.classList.remove('hidden');

                // വിജയകരമായാൽ ഫീസ് വിവരങ്ങൾ കാണിക്കുന്ന പേജിലേക്ക് പോകാം
                setTimeout(() => {
                    alert("ഐഡി: " + memberId + " -ന്റെ ഫീസ് വിവരങ്ങൾ ഉടൻ ലഭ്യമാകുന്നതാണ്.");
                }, 1000);
            } else {
                msgBox.className = "mb-4 p-3 rounded-xl text-sm text-center bg-rose-500/20 text-rose-300 border border-rose-500/30";
                msgBox.innerText = "ദയവായി ശരിയായ ഐഡിയും ഫോൺ നമ്പറും നൽകുക.";
                msgBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
