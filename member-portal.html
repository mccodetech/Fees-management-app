<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>അംഗങ്ങളുടെ പോർട്ടൽ - ഫീസ് സിസ്റ്റം</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen flex items-center justify-center p-4">

    <!-- Login Card -->
    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 p-8 text-white" id="loginCard">
        <div class="text-center mb-8">
            <div class="inline-flex bg-indigo-600/30 p-3 rounded-full mb-3 border border-indigo-400/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">അംഗങ്ങളുടെ പോർട്ടൽ</h1>
            <p class="text-slate-300 text-sm mt-1">ഫീസ് വിവരങ്ങൾ പരിശോധിക്കാൻ ലോഗിൻ ചെയ്യുക</p>
        </div>

        <div id="messageBox" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

        <form onsubmit="handleMemberLogin(event)" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-200 mb-2">അംഗത്തിന്റെ ഐഡി (ഉദാ: MD01-001)</label>
                <input type="text" id="memberId" required 
                    class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white uppercase placeholder-slate-500 transition"
                    placeholder="INSTCODE-001">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-200 mb-2">മൊബൈൽ നമ്പർ</label>
                <input type="tel" id="memberPhone" required 
                    class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition"
                    placeholder="9876543210">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
                വിവരങ്ങൾ പരിശോധിക്കുക
            </button>
        </form>
    </div>

    <!-- Member Fee Dashboard View (Initially Hidden) -->
    <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 text-white hidden" id="dashboardCard">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <div>
                <p class="text-xs text-indigo-400 font-bold" id="displayInstName">സ്ഥാപനത്തിന്റെ പേര്</p>
                <h2 class="text-lg font-bold uppercase mt-1" id="displayName">അംഗത്തിന്റെ പേര്</h2>
                <p class="text-xs text-slate-400">ID: <span id="displayId"></span> | വീട്: <span id="displayHouse"></span></p>
            </div>
            <button onclick="logoutMember()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-3 py-1.5 rounded-xl text-xs font-medium transition">
                പുറത്തു കടക്കുക
            </button>
        </div>

        <div class="space-y-4">
            <!-- Pending Fees Section -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <p class="text-xs font-semibold text-amber-400 mb-2">അടയ്ക്കാനുള്ള ഫീസുകൾ (Pending Fees)</p>
                <div id="pendingFeesBox" class="space-y-2">
                    <p class="text-xs text-slate-400">അടയ്ക്കാൻ ബാക്കി ഫീസുകൾ ഒന്നുമില്ല.</p>
                </div>
            </div>

            <!-- Paid History Section -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <p class="text-xs font-semibold text-emerald-400 mb-2">അടച്ച ഫീസുകളുടെ വിവരങ്ങൾ (Paid History)</p>
                <div id="paidHistoryBox" class="space-y-2">
                    <p class="text-xs text-slate-400">ഇതുവരെ ഫീസുകൾ ഒന്നും അടച്ചിട്ടില്ല.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Script Section -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-DEAr98P18Pe3vfFdHC6bmIZyr47kLeg",
            authDomain: "fees-management-app-62588.firebaseapp.com",
            projectId: "fees-management-app-62588",
            storageBucket: "fees-management-app-62588.firebasestorage.app",
            messagingSenderId: "347392125928",
            appId: "1:347392125928:web:f4c9f6e23cee32f0a1525d",
            measurementId: "G-1VQGK123KY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.onload = function() {
            const savedId = localStorage.getItem('memberId');
            const savedPhone = localStorage.getItem('memberPhone');
            if (savedId && savedPhone) {
                document.getElementById('memberId').value = savedId;
                document.getElementById('memberPhone').value = savedPhone;
                fetchMemberData(savedId, savedPhone);
            }
        }

        window.handleMemberLogin = async function(event) {
            event.preventDefault();
            const memberId = document.getElementById('memberId').value.trim().toUpperCase();
            const phone = document.getElementById('memberPhone').value.trim();
            
            localStorage.setItem('memberId', memberId);
            localStorage.setItem('memberPhone', phone);

            await fetchMemberData(memberId, phone);
        }

        async function fetchMemberData(memberId, phone) {
            const msgBox = document.getElementById('messageBox');
            const submitBtn = document.getElementById('submitBtn');
            if(submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerText = "പരിശോധിക്കുന്നു...";
            }

            try {
                const q = query(
                    collection(db, "students"), 
                    where("studentId", "==", memberId),
                    where("phone", "==", phone)
                );
                
                const querySnapshot = await getDocs(q);
                let found = false;

                let studentName = "";
                let studentHouse = "";
                let instCode = "";
                let pendingHtml = "";
                let paidHtml = "";
                let hasPending = false;
                let hasPaid = false;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    studentName = data.name;
                    studentHouse = data.house;
                    instCode = data.instCode;

                    if (data.status === "Paid") {
                        hasPaid = true;
                        paidHtml += `
                            <div class="bg-slate-900 border border-emerald-500/30 rounded-lg p-2.5 flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-semibold text-white">${data.feeType} (${data.extraInput || '-'})</span>
                                    <p class="text-slate-400 text-[10px]">തീയതി: ${data.paidDate} | രസീത്: ${data.receiptNo}</p>
                                </div>
                                <span class="text-emerald-400 font-bold">₹ ${data.amount} (Paid)</span>
                            </div>
                        `;
                    } else {
                        hasPending = true;
                        pendingHtml += `
                            <div class="bg-slate-900 border border-amber-500/30 rounded-lg p-2.5 flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-semibold text-white">${data.feeType} (${data.extraInput || '-'})</span>
                                    <p class="text-amber-400 text-[10px]">അടയ്ക്കാനുണ്ട്</p>
                                </div>
                                <span class="text-amber-400 font-bold text-sm">₹ ${data.amount}</span>
                            </div>
                        `;
                    }
                    found = true;
                });

                if (found) {
                    let instName = "സ്ഥാപനം";
                    const instQ = query(collection(db, "institutions"), where("instCode", "==", instCode));
                    const instSnap = await getDocs(instQ);
                    instSnap.forEach((instDoc) => {
                        instName = instDoc.data().name;
                    });

                    document.getElementById('displayInstName').innerText = instName.toUpperCase();
                    document.getElementById('displayName').innerText = studentName;
                    document.getElementById('displayId').innerText = memberId;
                    document.getElementById('displayHouse').innerText = studentHouse ? studentHouse.toUpperCase() : '-';

                    document.getElementById('pendingFeesBox').innerHTML = hasPending ? pendingHtml : `<p class="text-xs text-emerald-400">അടയ്ക്കാൻ ബാക്കി ഫീസുകൾ ഒന്നുമില്ല!</p>`;
                    document.getElementById('paidHistoryBox').innerHTML = hasPaid ? paidHtml : `<p class="text-xs text-slate-400">ഇതുവരെ ഫീസുകൾ ഒന്നും അടച്ചിട്ടില്ല.</p>`;

                    document.getElementById('loginCard').classList.add('hidden');
                    document.getElementById('dashboardCard').classList.remove('hidden');
                } else if (submitBtn) {
                    msgBox.className = "mb-4 p-3 rounded-xl text-sm text-center bg-rose-500/20 text-rose-300 border border-rose-500/30";
                    msgBox.innerText = "നൽകിയ ഐഡിയും ഫോൺ നമ്പറും തമ്മിൽ പൊരുത്തപ്പെടുന്നില്ല.";
                    msgBox.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Login error: ", error);
            } finally {
                if(submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "വിവരങ്ങൾ പരിശോധിക്കുക";
                }
            }
        }

        window.logoutMember = function() {
            localStorage.removeItem('memberId');
            localStorage.removeItem('memberPhone');
            document.getElementById('dashboardCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('memberId').value = '';
            document.getElementById('memberPhone').value = '';
        }
    </script>
</body>
</html>
